# v5.17 (2026-10-16, part J): run the server at nice -20.
# At nice 0 a fully loaded board (4 busy cores) stretches the 512 net 471 -> 899 ms
# (the per-strip GDMA ioctl sleeps and its wake-up loses the core); nice -20 keeps it
# at load-free latency (perf_j/j_results_2026-10-16.md, J3 b). chrt -f is refused
# (cgroup cpu.rt_runtime_us = 0), so no realtime policy.
# Installed by boot/deploy_board_v5.py activate to
# /etc/systemd/system/tcp-image-server.service.d/10-nice.conf (removed again by rollback
# when the release before had none).
[Service]
Nice=-20
